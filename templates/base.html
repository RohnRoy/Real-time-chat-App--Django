<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Chat App{% endblock %}</title>
    <style>
        :root {
            --bg: #f6f8fb;
            --card: #ffffff;
            --text: #172336;
            --muted: #64748b;
            --line: #d7deea;
            --accent: #2c6bed;
            --accent-soft: #e8efff;
            --ok: #18a957;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--text);
            font-family: "Manrope", "Noto Sans", sans-serif;
            background: radial-gradient(circle at 15% 0%, #e7efff 0%, var(--bg) 45%);
        }

        a {
            color: var(--accent);
            text-decoration: none;
        }

        .page {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px 14px 30px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .brand {
            font-weight: 800;
            letter-spacing: 0.2px;
            color: #10213d;
        }

        .user-pill {
            background: var(--card);
            border: 1px solid var(--line);
            padding: 8px 10px;
            border-radius: 999px;
            font-size: 13px;
            color: var(--muted);
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 10px 30px rgba(25, 53, 117, 0.08);
        }

        h1 {
            margin: 0 0 12px;
            font-size: 22px;
        }

        .muted {
            color: var(--muted);
            font-size: 14px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .form-grid p {
            margin: 0 0 10px;
        }

        label {
            display: block;
            margin-bottom: 4px;
            font-size: 14px;
            color: #2f3f5a;
        }

        input, textarea {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px 11px;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            background: #fff;
        }

        input:focus, textarea:focus {
            border-color: #9db8f8;
            box-shadow: 0 0 0 4px rgba(44, 107, 237, 0.12);
        }

        button {
            border: 0;
            border-radius: 10px;
            background: var(--accent);
            color: #fff;
            font-weight: 600;
            padding: 10px 13px;
            cursor: pointer;
        }

        button.ghost {
            background: #edf2fb;
            color: #24344f;
        }

        .user-list {
            list-style: none;
            margin: 0;
            padding: 0;
            display: grid;
            gap: 10px;
        }

        .user-item {
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: inherit;
        }

        .status {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            display: inline-block;
            margin-left: 6px;
            background: #94a3b8;
        }

        .status.online {
            background: var(--ok);
        }

        .chat-window {
            border: 1px solid var(--line);
            border-radius: 12px;
            background: #fbfdff;
            height: 380px;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 10px;
        }

        .message-row {
            display: flex;
            margin-bottom: 8px;
        }

        .message-row.mine {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: min(85%, 420px);
            border-radius: 12px;
            background: #f0f4fb;
            padding: 8px 10px;
        }

        .message-row.mine .message-bubble {
            background: var(--accent-soft);
        }

        .message-text {
            margin: 0;
            word-break: break-word;
        }

        .message-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
        }

        .delete-message-btn {
            border: 1px solid #d6dded;
            background: #ffffff;
            color: #4a5a78;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 11px;
            line-height: 1.6;
            cursor: pointer;
            flex-shrink: 0;
        }

        .delete-message-btn:hover {
            background: #f3f6fc;
        }

        .message-bubble.deleted {
            background: #f7f8fa;
            color: #6b7280;
        }

        .deleted-label {
            margin-left: 6px;
            color: #6b7280;
            font-style: italic;
        }

        .message-meta {
            margin-top: 4px;
            font-size: 12px;
            color: var(--muted);
            text-align: right;
        }

        .composer {
            display: flex;
            gap: 8px;
        }

        .composer input {
            flex: 1;
        }

        .unread-badge {
            min-width: 22px;
            height: 22px;
            padding: 0 7px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            background: #e93030;
            color: #ffffff;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="page">
        <header class="topbar">
            <a class="brand" href="{% url 'user_list' %}">Chat Application</a>
            {% if request.user.is_authenticated %}
                <div class="user-pill">{{ request.user.username }}</div>
            {% endif %}
        </header>
        <main class="card">
            {% block content %}{% endblock %}
        </main>
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
